version: '3.8'

x-airflow-common: &airflow-common
  build: .
  image: custom-airflow-music-pipeline:3.1.8
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    PYTHONPATH: /opt/airflow
    # Application DB configs
    SOURCE_DB_TYPE: mysql
    SOURCE_DB_HOST: source-db
    SOURCE_DB_PORT: 3306
    SOURCE_DB_USER: root
    SOURCE_DB_PASSWORD: rootpassword
    SOURCE_DB_NAME: grammy_source_db
    DW_DB_TYPE: postgres
    DW_DB_HOST: dw-postgres
    DW_DB_PORT: 5432
    DW_DB_USER: dw_admin
    DW_DB_PASSWORD: dw_password
    DW_DB_NAME: music_dw
    SPOTIFY_CSV_PATH: /opt/airflow/spotify_dataset.csv
    GRAMMY_CSV_PATH: /opt/airflow/the_grammy_awards.csv
    DATA_DIR: /opt/airflow/data
    EVIDENCE_DIR: /opt/airflow/docs/evidence
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./sql:/opt/airflow/sql
    - ./gx:/opt/airflow/gx
    - ./docs:/opt/airflow/docs
    - ./data:/opt/airflow/data
    - ./spotify_dataset.csv:/opt/airflow/spotify_dataset.csv
    - ./the_grammy_awards.csv:/opt/airflow/the_grammy_awards.csv
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy
    source-db:
      condition: service_healthy
    dw-postgres:
      condition: service_healthy

services:
  # Metadata DB for Airflow
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Operational Source Relational DB (MySQL)
  source-db:
    image: mysql:8.0
    container_name: source-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: grammy_source_db
    ports:
      - "3307:3306"
    volumes:
      - source-db-data:/var/lib/mysql
      - ./sql/source_setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: always

  # Analytical Target Data Warehouse (PostgreSQL)
  dw-postgres:
    image: postgres:16-alpine
    container_name: dw-postgres
    environment:
      POSTGRES_USER: dw_admin
      POSTGRES_PASSWORD: dw_password
      POSTGRES_DB: music_dw
    ports:
      - "5433:5432"
    volumes:
      - dw-postgres-data:/var/lib/postgresql/data
      - ./sql/dw_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dw_admin", "-d", "music_dw"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username airflow \
          --firstname Data \
          --lastname Engineer \
          --role Admin \
          --email airflow@example.com \
          --password airflow
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres-data:
  source-db-data:
  dw-postgres-data:
